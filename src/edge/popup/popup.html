<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>罗睺镜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 200px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        .toggle-container {
            text-align: center;
        }

        .toggle-label {
            display: block;
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toggle-btn {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .toggle-btn:active {
            transform: translateY(0);
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            box-shadow: 0 2px 8px rgba(72, 187, 120, 0.3);
        }

        .clear-btn {
            width: 100%;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #fc8181 0%, #e53e3e 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(252, 129, 129, 0.3);
        }

        .clear-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(252, 129, 129, 0.4);
        }

        .clear-btn:active {
            transform: translateY(0);
        }

        .status {
            margin-top: 12px;
            font-size: 12px;
            color: #667eea;
            padding: 6px 10px;
            background: #f7fafc;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }
    </style>
</head>
<body>
    <div class="toggle-container">
        <label class="toggle-label">罗睺镜面板</label>
        <div class="btn-group">
            <button id="toggle-btn" class="toggle-btn">开启面板</button>
            <button id="clear-btn" class="clear-btn">🗑️ 清空当前缓存</button>
        </div>
        <div id="status" class="status" style="display: none;"></div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
